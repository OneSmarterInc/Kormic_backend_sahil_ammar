name: Remove approved merged branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/approved-branch-cleanup.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run approved merged-branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [{"name":"fix/basic-info-persistence","sha":"645abfd3a86df3af2740b5090093d1606b7345d6","pr":2},{"name":"fix/canonical-claim-profile-registration","sha":"a5d0bb31a514729bdb3682d74b794805d6b8e633","pr":1},{"name":"fix/compose-db-env-source","sha":"11aa91ed231024c87af3543b3c342573f8574100","pr":3},{"name":"fix/p0-06-kormic-operator-runbook","sha":"fc165178787585e9ebcf9e419166a908416955a8","pr":5},{"name":"fix/p0-07-required-ci-baselines","sha":"65130b6730dfddc9c6e752c99add69491a1b2611","pr":6},{"name":"fix/p1-02-production-claim-links","sha":"d61a5f29c653dbc69eeb6ab5534487626c31e76c","pr":7},{"name":"fix/p1-03-claim-url-environment","sha":"eefd31d70be4b73bb7463e9bf1394e5b79f4f639","pr":8},{"name":"fix/p1-04-totp-encryption-portal-login","sha":"332c08f875f4ce3b7a9141b3433047349bce1cc8","pr":9},{"name":"fix/port-8000-local-production","sha":"a5aac7e608d4f77366b69cf582b7e5da0311a140","pr":4}];
            const {owner, repo} = context.repo;
            for (const target of targets) {
              if (target.name === 'main') throw new Error('Refusing to delete main');
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: target.pr});
              if (!pr.merged || pr.base.ref !== 'main' || pr.head.sha !== target.sha)
                throw new Error('Merged PR verification failed: ' + target.name);
              const {data: comparison} = await github.rest.repos.compareCommits({owner, repo, base: pr.merge_commit_sha, head: 'main'});
              if (!['ahead', 'identical'].includes(comparison.status))
                throw new Error('Merge is not preserved in main: ' + target.name);
              const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/' + target.name});
              if (ref.object.sha !== target.sha) throw new Error('Branch moved: ' + target.name);
            }
            for (const target of targets) {
              const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/' + target.name});
              if (ref.object.sha !== target.sha) throw new Error('Branch moved: ' + target.name);
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + target.name});
              core.info('Deleted merged branch: ' + target.name);
            }
