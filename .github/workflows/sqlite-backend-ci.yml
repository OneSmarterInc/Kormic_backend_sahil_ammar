name: SQLite backend CI

on:
  push:
    branches: [main]
    paths:
      - "kormic_backend/**"
      - "pure_multi_agent/**"
      - "accounts/**"
      - "django_api/**"
      - "institutes/**"
      - "institutes_list/**"
      - "universities/**"
      - "verification/**"
      - "notifications/**"
      - "project_superuser/**"
      - "requirements.txt"
      - ".env.template"
      - "SQLITE_MIGRATION.md"
      - ".github/workflows/sqlite-backend-ci.yml"
  pull_request:
    paths:
      - "kormic_backend/**"
      - "pure_multi_agent/**"
      - "accounts/**"
      - "django_api/**"
      - "institutes/**"
      - "institutes_list/**"
      - "universities/**"
      - "verification/**"
      - "notifications/**"
      - "project_superuser/**"
      - "requirements.txt"
      - ".env.template"
      - "SQLITE_MIGRATION.md"
      - ".github/workflows/sqlite-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      SQLITE_PATH: db.sqlite3
      AGENT_CHECKPOINTER_SQLITE_PATH: agent_checkpoints.sqlite3
      DJANGO_SECRET_KEY: sqlite-ci-secret-key-32-bytes-minimum
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_MODE: dev
      ANTHROPIC_API_KEY: test-key
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -c "from cryptography.fernet import Fernet; print('TOTP_SECRET_KEYS=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run

  sqlite-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENGINE: sqlite
      SQLITE_PATH: db.sqlite3
      AGENT_CHECKPOINTER_SQLITE_PATH: agent_checkpoints.sqlite3
      DJANGO_SECRET_KEY: sqlite-ci-secret-key-32-bytes-minimum
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_MODE: dev
      ANTHROPIC_API_KEY: test-key
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -c "from cryptography.fernet import Fernet; print('TOTP_SECRET_KEYS=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - run: python manage.py migrate --noinput
      - run: python manage.py shell -c "from django.db import connection; print(connection.vendor); assert connection.vendor == 'sqlite'"

  sqlite-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_ENGINE: sqlite
      SQLITE_PATH: db.sqlite3
      AGENT_CHECKPOINTER_SQLITE_PATH: agent_checkpoints.sqlite3
      DJANGO_SECRET_KEY: sqlite-ci-secret-key-32-bytes-minimum
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_MODE: dev
      ANTHROPIC_API_KEY: test-key
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -c "from cryptography.fernet import Fernet; print('TOTP_SECRET_KEYS=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
      - run: python manage.py test accounts.test_claim_registration accounts.test_basic_info_persistence institutes_list --verbosity 1
