name: Student profile schema contract

on:
  push:
    branches:
      - main
    paths:
      - "django_api/serializers.py"
      - "accounts/serializers.py"
      - "contracts/**"
      - "django_api/management/commands/export_client_contracts.py"
      - "django_api/schema_views.py"
      - "django_api/schema_generator.py"
      - "kormic_backend/settings.py"
      - "requirements.in"
      - "django_api/contract_urls.py"
      - "django_api/urls.py"
      - "django_api/test_profile_schema_contract.py"
      - "kormic_backend/urls.py"
      - "requirements.txt"
      - ".github/workflows/profile-contract-ci.yml"
  pull_request:
    paths:
      - "django_api/serializers.py"
      - "accounts/serializers.py"
      - "contracts/**"
      - "django_api/management/commands/export_client_contracts.py"
      - "django_api/schema_views.py"
      - "django_api/schema_generator.py"
      - "kormic_backend/settings.py"
      - "requirements.in"
      - "django_api/contract_urls.py"
      - "django_api/urls.py"
      - "django_api/test_profile_schema_contract.py"
      - "kormic_backend/urls.py"
      - "requirements.txt"
      - ".github/workflows/profile-contract-ci.yml"

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kormic_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kormic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: profile-contract-ci-secret-key
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_MODE: dev
      ANTHROPIC_API_KEY: test-key
      POSTGRES_DB: kormic_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_CACHE_URL: redis://localhost:6379/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.txt

      - name: Generate ephemeral encryption keys for CI
        run: python -c "import secrets; from cryptography.fernet import Fernet; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64)); print('TOTP_SECRET_KEYS=' + Fernet.generate_key().decode()); print('GITHUB_OAUTH_TOKEN_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Verify canonical profile OpenAPI contract
        run: python manage.py test django_api.test_profile_schema_contract --verbosity 2


      - name: Verify exported client snapshots match serializers
        run: python manage.py export_client_contracts --check
