name: Student profile schema contract

on:
  push:
    branches:
      - main
    paths:
      - "django_api/serializers.py"
      - "django_api/schema_views.py"
      - "django_api/contract_urls.py"
      - "django_api/urls.py"
      - "django_api/test_profile_schema_contract.py"
      - "kormic_backend/urls.py"
      - "requirements.txt"
      - ".github/workflows/profile-contract-ci.yml"
  pull_request:
    paths:
      - "django_api/serializers.py"
      - "django_api/schema_views.py"
      - "django_api/contract_urls.py"
      - "django_api/urls.py"
      - "django_api/test_profile_schema_contract.py"
      - "kormic_backend/urls.py"
      - "requirements.txt"
      - ".github/workflows/profile-contract-ci.yml"

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: profile-contract-ci-secret-key
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_MODE: dev
      ANTHROPIC_API_KEY: test-key
      POSTGRES_DB: kormic
      POSTGRES_USER: kormic
      POSTGRES_PASSWORD: kormic
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_CACHE_URL: redis://localhost:6379/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify canonical profile OpenAPI contract
        run: python manage.py test django_api.test_profile_schema_contract --verbosity 2
