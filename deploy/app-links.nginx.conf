# Install after pointing app.kormic.ai DNS at this server and issuing its TLS
# certificate. Keep the existing backend.kormic.ai API server block separate.
server {
    listen 80;
    server_name app.kormic.ai;
    access_log off;
    return 301 https://app.kormic.ai$request_uri;
}

server {
    listen 443 ssl;
    server_name app.kormic.ai;
    ssl_certificate /etc/letsencrypt/live/app.kormic.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kormic.ai/privkey.pem;

    # Invitation tokens must not enter proxy access logs. Apply equivalent
    # query redaction at any CDN/load balancer in front of this server.
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;

    # Preserve exact paths: association files must return 200 JSON directly,
    # without a login redirect, a slash redirect, or SPA HTML.
    location = /.well-known/assetlinks.json { proxy_pass http://127.0.0.1:8000; }
    location = /.well-known/apple-app-site-association { proxy_pass http://127.0.0.1:8000; }
    location = /claim { proxy_pass http://127.0.0.1:8000; }
    location = /claim/ { proxy_pass http://127.0.0.1:8000; }
    location / { return 404; }
}
